<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Grid – Future Gear Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap">
<style>
/* ===== Design tokens ===== */
:root{--bg:#0a0a0c;--bg2:#121216;--c1:#00f2fe;--c2:#4facfe;--pu:#8b5cf6;--tx:#e9eef5;--mut:#8a93a3;--bd:rgba(0,242,254,.2);
--glass:rgba(255,255,255,.04);--grad:linear-gradient(120deg,#00f2fe,#4facfe 50%,#8b5cf6);--r:16px;
--f:'Space Grotesk','Inter',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 'Inter',system-ui,sans-serif;min-height:100%;
background-image:linear-gradient(rgba(0,242,254,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,242,254,.04) 1px,transparent 1px);background-size:44px 44px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(10,10,12,.85);z-index:60}
h1,h2,h3,.f{font-family:var(--f);letter-spacing:-.02em;margin:0}
h1{font-size:clamp(2.4rem,7vw,4.8rem);line-height:1.02}h2{font-size:clamp(1.5rem,3.5vw,2.2rem)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.sec{padding:56px 0}
.mut{color:var(--mut)}.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,10,12,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;gap:20px;height:64px}
.logo{font:700 1.3rem var(--f);margin-right:auto;text-shadow:0 0 18px var(--c1)}
.nav a.l{color:var(--mut);transition:.2s}.nav a.l:hover,.nav a.on{color:var(--c1);text-shadow:0 0 12px var(--c1)}
.ic{background:none;border:1px solid var(--bd);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;position:relative;transition:.2s}
.ic:hover{box-shadow:0 0 16px rgba(0,242,254,.4);border-color:var(--c1)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--pu);border-radius:99px;font-size:.7rem;min-width:18px;height:18px;display:grid;place-items:center}
/* buttons */
.btn{border:0;border-radius:12px;padding:13px 24px;font:500 1rem var(--f);background:var(--grad);color:#04070c;transition:.25s;box-shadow:0 0 0 rgba(0,242,254,0)}
.btn:hover{box-shadow:0 0 28px rgba(0,242,254,.55);transform:translateY(-2px)}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--c1)}.btn.o:hover{background:rgba(0,242,254,.1)}
.btn:disabled{opacity:.5;pointer-events:none}
/* glass cards */
.card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:var(--r);transition:.3s}
.card:hover{border-color:var(--c1);box-shadow:0 0 26px rgba(0,242,254,.22)}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;min-height:78vh}
.hero p{max-width:46ch;font-size:1.1rem}
.orb{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(6rem,18vw,11rem);
background:radial-gradient(circle at 35% 30%,rgba(0,242,254,.35),rgba(139,92,246,.25) 55%,transparent 72%);border:1px solid var(--bd);animation:fl 5s ease-in-out infinite;box-shadow:0 0 80px rgba(79,172,254,.25)}
@keyframes fl{50%{transform:translateY(-18px)}}
/* flash timer */
.flash{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;padding:26px;margin-top:20px}
.tm{display:flex;gap:10px}.tm div{text-align:center;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-width:64px}
.tm b{display:block;font:700 1.7rem var(--f);color:var(--c1);text-shadow:0 0 14px var(--c1)}.tm small{color:var(--mut)}
/* grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.cat{padding:28px;text-align:left;cursor:pointer;font-size:1.1rem}.cat span{font-size:2.2rem;display:block;margin-bottom:8px}
.car{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:thin}
.car>*{flex:0 0 250px;scroll-snap-align:start}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px;gap:12px}
/* product card */
.pc{overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.art{aspect-ratio:1;display:grid;place-items:center;font-size:4.6rem;position:relative}
.pc .art{transition:.4s}.pc:hover .art{transform:scale(1.06)}
.pc .art-w{overflow:hidden}
.pb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pr{font:700 1.15rem var(--f);color:var(--c1)}.st{color:#ffd166;font-size:.85rem}
.qv{position:absolute;bottom:10px;left:50%;transform:translate(-50%,12px);opacity:0;transition:.25s;padding:8px 16px;border-radius:99px;background:rgba(10,10,12,.8);border:1px solid var(--c1);font-size:.85rem;white-space:nowrap}
.pc:hover .qv{opacity:1;transform:translate(-50%,0)}
/* shop layout */
.shop{display:grid;grid-template-columns:260px 1fr;gap:28px}
.fil{padding:20px;height:fit-content;position:sticky;top:90px}
.fil h3{font-size:1rem;margin:18px 0 8px}.fil h3:first-child{margin-top:0}
.fil label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
input,select{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;color:var(--tx);padding:12px;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--c1);box-shadow:0 0 14px rgba(0,242,254,.3)}
input[type=range]{padding:0;accent-color:var(--c1)}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--c1)}
/* product page */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.main{border-radius:var(--r);overflow:hidden;font-size:9rem}.main .art{font-size:inherit}
.th{display:flex;gap:10px;margin-top:12px}.th button{flex:1;border:1px solid var(--bd);border-radius:12px;overflow:hidden;padding:0;background:none;font-size:2rem}
.th button.on{border-color:var(--c1);box-shadow:0 0 14px rgba(0,242,254,.4)}
.th .art{aspect-ratio:1;font-size:2rem}
.spec{width:100%;border-collapse:collapse;margin:16px 0}.spec td{padding:10px 0;border-bottom:1px solid var(--bd)}.spec td:first-child{color:var(--mut)}
.bar{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden;margin:6px 0 16px}.bar i{display:block;height:100%;background:var(--grad)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.qty button{background:none;border:0;width:40px;height:40px;font-size:1.2rem}.qty button:hover{background:rgba(0,242,254,.12)}.qty span{min-width:34px;text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:.3s}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg2);border-left:1px solid var(--c1);z-index:90;transform:translateX(100%);transition:.35s;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
.dr.on{transform:none}.dr .ls{flex:1;overflow:auto}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.li .art{width:60px;aspect-ratio:1;font-size:1.8rem;border-radius:12px;flex:none}
.sum div{display:flex;justify-content:space-between;padding:4px 0}.sum .t{font:700 1.3rem var(--f);color:var(--c1);border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}
/* checkout */
.co{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
.steps{display:flex;gap:8px;margin-bottom:22px}.steps div{flex:1;padding:10px;border-bottom:3px solid var(--bd);color:var(--mut);font-family:var(--f)}.steps .on{border-color:var(--c1);color:var(--c1)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg .w{grid-column:1/-1}.fg label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{flex:1;min-width:110px;padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--bd);transition:.2s}
.tabs .on{border-color:var(--c1);box-shadow:0 0 16px rgba(0,242,254,.35);color:var(--c1)}
.cc{perspective:900px;max-width:360px;margin:0 auto 20px}.cc>div{aspect-ratio:1.586;border-radius:18px;padding:22px;position:relative;transition:.6s;transform-style:preserve-3d;
background:linear-gradient(135deg,#0d2a3a,#2a1858 70%,#4facfe);border:1px solid var(--c1);box-shadow:0 0 36px rgba(0,242,254,.3)}
.cc.fl>div{transform:rotateY(180deg)}
.cc .fc,.cc .bk{position:absolute;inset:0;padding:22px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between}
.cc .bk{transform:rotateY(180deg)}.cc .no{font:500 1.35rem var(--f);letter-spacing:.12em}
.mag{height:40px;background:#000;margin:0 -22px}.cv{background:#fff;color:#000;text-align:right;padding:6px 10px;border-radius:6px;font-family:monospace}
.qr{width:210px;margin:0 auto 14px;padding:12px;background:#fff;border-radius:14px;position:relative;box-shadow:0 0 36px var(--c1);overflow:hidden}
.qr svg{display:block;width:100%}.qr::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--c1);box-shadow:0 0 14px var(--c1);animation:sc 2s linear infinite}
@keyframes sc{from{top:0}to{top:100%}}
.wl{width:100%;display:flex;justify-content:space-between;padding:16px;margin-bottom:10px;border-radius:12px;background:var(--bg2);border:1px solid var(--bd)}
.wl:hover{border-color:var(--pu);box-shadow:0 0 18px rgba(139,92,246,.4)}
.ok{text-align:center;padding:60px 0}.ok svg{width:120px;height:120px}
.ok circle,.ok path{fill:none;stroke:var(--c1);stroke-width:4;stroke-linecap:round;stroke-dasharray:300;stroke-dashoffset:300;animation:dr 1s .1s forwards;filter:drop-shadow(0 0 8px var(--c1))}
.ok path{animation-delay:.7s;stroke-dasharray:60;stroke-dashoffset:60}@keyframes dr{to{stroke-dashoffset:0}}
.oid{display:inline-block;font:700 1.5rem var(--f);letter-spacing:.08em;padding:10px 20px;border:1px dashed var(--c1);border-radius:12px;margin:16px 0;color:var(--c1)}
.load{position:fixed;inset:0;background:rgba(10,10,12,.88);z-index:100;display:none;place-items:center;text-align:center}
.load.on{display:grid}.sp{width:56px;height:56px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--c1);animation:rt 1s linear infinite;margin:0 auto 14px}@keyframes rt{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--bg2);border:1px solid var(--c1);padding:12px 20px;border-radius:12px;z-index:120;transition:.3s;box-shadow:0 0 22px rgba(0,242,254,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--bd);padding:30px 0;color:var(--mut);margin-top:40px}
/* responsive */
@media(max-width:900px){.hero,.pd,.co,.shop{grid-template-columns:1fr}.hero{min-height:auto;padding-top:20px}.fil{position:static}.nav a.l{display:none}.orb{max-width:300px;margin:auto}}
@media(max-width:520px){.fg{grid-template-columns:1fr}.main{font-size:6rem}.car>*{flex-basis:220px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a class="logo" href="#home">NOVA<span class="grad">GRID</span></a>
  <a class="l" href="#home" data-r="home">Home</a><a class="l" href="#shop" data-r="shop">Shop</a>
  <button class="ic" aria-label="Open cart" onclick="drawer(1)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
    <span class="badge" id="bd">0</span></button>
</div></header>
<main id="app"></main>
<footer><div class="wrap">© 2026 Nova Grid. Demo store: no real payments are processed.</div></footer>
<div class="ov" id="ov" onclick="drawer(0)"></div>
<aside class="dr" id="dr" aria-label="Cart"></aside>
<div class="load" id="ld"><div><div class="sp"></div><div class="f" id="ldt">Securing transaction…</div></div></div>
<div class="toast" id="ts"></div>

<script>
/* ===== Data ===== */
const P=[
{id:1,n:'Halo AR Visor',c:'Wearables',p:24999,r:4.8,s:12,e:'🥽',h:190,d:'Lightweight mixed-reality visor with a wide field of view.',sp:{Display:'4K micro-OLED per eye',Battery:'6 hours',Weight:'218 g',Link:'Wi-Fi 7'}},
{id:2,n:'Pulse Neural Band',c:'Wearables',p:8499,r:4.5,s:40,e:'⌚',h:270,d:'Health band that tracks recovery, focus and sleep.',sp:{Sensors:'ECG, SpO2, HRV',Battery:'12 days',Water:'50 m',Weight:'32 g'}},
{id:3,n:'Echo Void Headphones',c:'Audio',p:12999,r:4.7,s:8,e:'🎧',h:200,d:'Adaptive noise cancelling with spatial sound.',sp:{Driver:'40 mm graphene',ANC:'Adaptive, 48 dB',Battery:'60 hours',Codec:'LDAC, aptX'}},
{id:4,n:'Static Mini Speaker',c:'Audio',p:4999,r:4.2,s:65,e:'🔊',h:250,d:'Pocket speaker with a pulsing light ring.',sp:{Output:'20 W',Battery:'14 hours',Water:'IP67',Weight:'410 g'}},
{id:5,n:'Neon Rift Jacket',c:'Apparel',p:9999,r:4.6,s:15,e:'🧥',h:290,d:'Weatherproof shell with reflective neon piping.',sp:{Fabric:'3-layer Gore-Tex',Fit:'Relaxed',Pockets:'6 hidden',Weight:'640 g'}},
{id:6,n:'Cipher Sneakers',c:'Apparel',p:7499,r:4.4,s:30,e:'👟',h:180,d:'Cushioned runners with a glow-in-the-dark sole.',sp:{Upper:'Knit mesh',Sole:'Reactive foam',Weight:'260 g',Sizes:'UK 6–12'}},
{id:7,n:'Orbit Drone Mk2',c:'Gadgets',p:32999,r:4.9,s:5,e:'🛸',h:215,d:'Foldable 5K drone with obstacle avoidance.',sp:{Camera:'5K / 60 fps',Flight:'38 min',Range:'12 km',Weight:'249 g'}},
{id:8,n:'Quantum Key Vault',c:'Gadgets',p:3999,r:4.1,s:90,e:'🔐',h:260,d:'Hardware wallet and passkey vault in one.',sp:{Chip:'Secure element',Auth:'Fingerprint',Coins:'5,000+',Link:'USB-C, NFC'}}];
const CATS=[['Wearables','🥽'],['Audio','🎧'],['Apparel','🧥'],['Gadgets','🛸']];
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const S={cart:JSON.parse('{}'),promo:0,cur:null,img:0,qty:1,step:1,pay:'card',cats:[],max:35000,minR:0,sort:'pop',ship:{},done:null,wallet:null};
const $=s=>document.querySelector(s),get=id=>P.find(p=>p.id==id);
/* ===== Helpers ===== */
const art=(p,v=0,x='')=>`<div class="art ${x}" style="background:radial-gradient(circle at 50% 40%,hsla(${(p.h+v*40)%360},90%,55%,.45),hsla(${(p.h+v*40+60)%360},80%,25%,.35) 60%,#0a0a0c)"><span style="filter:drop-shadow(0 0 18px hsl(${p.h},100%,60%));transform:scale(${1+v*.12}) rotate(${v*8}deg)">${p.e}</span></div>`;
const stars=r=>'★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r))+` <span class="mut">${r}</span>`;
function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2000)}
function totals(){let sub=0;for(const id in S.cart)sub+=get(id).p*S.cart[id];
 const disc=sub*S.promo,ship=sub&&sub-disc<5000?199:0,tax=(sub-disc)*.18;return{sub,disc,ship,tax,total:sub-disc+ship+tax}}
const count=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const pcard=p=>`<article class="card pc" onclick="openP(${p.id})"><div class="art-w" style="position:relative">${art(p)}<span class="qv">Quick view</span></div>
 <div class="pb"><span class="mut" style="font-size:.85rem">${p.c}</span><h3 style="font-size:1.05rem">${p.n}</h3><span class="st">${stars(p.r)}</span>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto"><span class="pr">${inr(p.p)}</span>
 <button class="btn" style="padding:8px 14px" onclick="event.stopPropagation();add(${p.id},1)">Add</button></div></div></article>`;

/* ===== Cart ===== */
function add(id,q){S.cart[id]=Math.min((S.cart[id]||0)+q,get(id).s);sync();toast(get(id).n+' added to cart')}
function chg(id,d){S.cart[id]+=d;if(S.cart[id]<=0)delete S.cart[id];sync()}
function promo(v){const c=v.trim().toUpperCase();if(c==='NOVA20'){S.promo=.2;toast('NOVA20 applied: 20% off')}else{S.promo=0;toast('Code not valid. Try NOVA20')}sync()}
function sync(){$('#bd').textContent=count();drawerHTML();if(S.route==='checkout'&&!S.done)render()}
function drawer(o){$('#dr').classList.toggle('on',!!o);$('#ov').classList.toggle('on',!!o);if(o)drawerHTML()}
function drawerHTML(){const t=totals(),ids=Object.keys(S.cart);
 $('#dr').innerHTML=`<div class="row" style="justify-content:space-between"><h2>Your cart</h2><button class="ic" aria-label="Close cart" onclick="drawer(0)">✕</button></div>
 <div class="ls">${ids.length?ids.map(i=>{const p=get(i);return`<div class="li">${art(p)}<div style="flex:1"><b>${p.n}</b><div class="pr">${inr(p.p)}</div>
 <div class="qty"><button onclick="chg(${i},-1)" aria-label="Less">−</button><span>${S.cart[i]}</span><button onclick="chg(${i},1)" aria-label="More">+</button></div></div></div>`}).join(''):'<p class="mut">Your cart is empty. Browse the shop to add gear.</p>'}</div>
 <div class="sum"><div class="row" style="margin-bottom:8px"><input id="pc" placeholder="Promo code (NOVA20)" style="flex:1"><button class="btn o" onclick="promo($('#pc').value)">Apply</button></div>
 ${sumHTML(t)}<button class="btn" style="width:100%;margin-top:10px" ${ids.length?'':'disabled'} onclick="drawer(0);S.step=1;location.hash='checkout'">Checkout</button></div>`}
function sumHTML(t){return`<div class="sum"><div><span class="mut">Subtotal</span><span>${inr(t.sub)}</span></div>${t.disc?`<div><span class="mut">Promo</span><span>−${inr(t.disc)}</span></div>`:''}
 <div><span class="mut">Shipping</span><span>${t.ship?inr(t.ship):'Free'}</span></div><div><span class="mut">GST (18%)</span><span>${inr(t.tax)}</span></div><div class="t"><span>Total</span><span>${inr(t.total)}</span></div></div>`}
/* ===== Views ===== */
const V={
home(){return`<section class="wrap hero"><div><h1>Gear from the <span class="grad">next decade</span>, shipping today.</h1>
 <p class="mut">Visors, audio, apparel and gadgets built for people who live half in the grid. Free delivery over ₹5,000.</p>
 <div class="row" style="margin-top:24px"><a class="btn" href="#shop">Shop the drop</a><button class="btn o" onclick="openP(7)">See the Orbit Drone</button></div></div>
 <div class="orb" aria-hidden="true">🥽</div></section>
 <section class="wrap"><div class="card flash"><div><h2>Flash sale ends in</h2><span class="mut">Use code NOVA20 for 20% off at checkout</span></div>
 <div class="tm" id="tm"></div></div></section>
 <section class="wrap sec"><div class="head"><h2>Trending now</h2><div class="row"><button class="ic" aria-label="Previous" onclick="$('#car').scrollBy({left:-270,behavior:'smooth'})">‹</button><button class="ic" aria-label="Next" onclick="$('#car').scrollBy({left:270,behavior:'smooth'})">›</button></div></div>
 <div class="car" id="car">${P.slice().sort((a,b)=>b.r-a.r).map(pcard).join('')}</div></section>
 <section class="wrap"><div class="head"><h2>Browse by category</h2></div><div class="cats">${CATS.map(([c,e])=>`<button class="card cat" onclick="S.cats=['${c}'];location.hash='shop'"><span>${e}</span>${c}<div class="mut" style="font-size:.9rem">${P.filter(p=>p.c==c).length} items</div></button>`).join('')}</div></section>`},
shop(){let l=P.filter(p=>(!S.cats.length||S.cats.includes(p.c))&&p.p<=S.max&&p.r>=S.minR);
 const o={pop:(a,b)=>b.r-a.r,lo:(a,b)=>a.p-b.p,hi:(a,b)=>b.p-a.p};l.sort(o[S.sort]);
 return`<section class="wrap sec"><h2 style="margin-bottom:22px">Shop</h2><div class="shop"><aside class="card fil">
 <h3>Category</h3>${CATS.map(([c])=>`<label><input type="checkbox" ${S.cats.includes(c)?'checked':''} onchange="tg('${c}')">${c}</label>`).join('')}
 <h3>Max price: ${inr(S.max)}</h3><input type="range" min="3000" max="35000" step="500" value="${S.max}" oninput="S.max=+this.value;render(1)">
 <h3>Minimum rating</h3><select onchange="S.minR=+this.value;render(1)">${[0,4,4.5].map(v=>`<option value="${v}" ${S.minR==v?'selected':''}>${v?v+'★ & up':'Any rating'}</option>`).join('')}</select>
 <h3>Sort by</h3><select onchange="S.sort=this.value;render(1)"><option value="pop" ${S.sort=='pop'?'selected':''}>Top rated</option><option value="lo" ${S.sort=='lo'?'selected':''}>Price: low to high</option><option value="hi" ${S.sort=='hi'?'selected':''}>Price: high to low</option></select></aside>
 <div><p class="mut">${l.length} products</p><div class="grid">${l.map(pcard).join('')||'<p>No gear matches. Widen the price or rating filter.</p>'}</div></div></div></section>`},
product(){const p=S.cur,q=S.qty;return`<section class="wrap sec"><a class="mut" href="#shop">‹ Back to shop</a><div class="pd" style="margin-top:16px"><div>
 <div class="card main">${art(p,S.img)}</div><div class="th">${[0,1,2,3].map(i=>`<button class="${i==S.img?'on':''}" onclick="S.img=${i};render(1)" aria-label="View ${i+1}">${art(p,i)}</button>`).join('')}</div></div>
 <div><span class="mut">${p.c}</span><h1 style="font-size:clamp(2rem,5vw,3rem)">${p.n}</h1><p class="st">${stars(p.r)}</p><div class="pr" style="font-size:2rem">${inr(p.p)}</div><p class="mut">${p.d}</p>
 <table class="spec">${Object.entries(p.sp).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>
 <div class="row" style="justify-content:space-between"><span>${p.s<=10?'Only '+p.s+' left':p.s+' in stock'}</span></div><div class="bar"><i style="width:${Math.min(100,p.s)}%"></i></div>
 <div class="row"><div class="qty"><button onclick="S.qty=Math.max(1,S.qty-1);render(1)" aria-label="Less">−</button><span>${q}</span><button onclick="S.qty=Math.min(${p.s},S.qty+1);render(1)" aria-label="More">+</button></div>
 <button class="btn" onclick="add(${p.id},S.qty)">Add to cart</button><button class="btn o" onclick="add(${p.id},S.qty);S.step=1;location.hash='checkout'">Buy now</button></div></div></div></section>`},
checkout(){if(S.done)return done();const t=totals();if(!count())return`<section class="wrap sec"><h2>Your cart is empty</h2><p class="mut">Add something first.</p><a class="btn" href="#shop">Go to shop</a></section>`;
 return`<section class="wrap sec"><h2 style="margin-bottom:18px">Checkout</h2><div class="co"><div class="card" style="padding:24px">
 <div class="steps"><div class="${S.step==1?'on':''}">1 Shipping</div><div class="${S.step==2?'on':''}">2 Payment</div></div>${S.step==1?shipF():payF(t)}</div>
 <div class="card" style="padding:22px"><h3 style="margin-bottom:10px">Order summary</h3>${Object.keys(S.cart).map(i=>`<div class="row" style="justify-content:space-between"><span>${get(i).n} × ${S.cart[i]}</span><span>${inr(get(i).p*S.cart[i])}</span></div>`).join('')}<hr style="border-color:var(--bd)">${sumHTML(t)}
 <div class="row" style="margin-top:12px"><input id="pc2" placeholder="Promo code" style="flex:1"><button class="btn o" onclick="promo($('#pc2').value)">Apply</button></div></div></div></section>`}};
function shipF(){const s=S.ship;const f=(k,l,w='')=>`<div class="${w}"><label for="${k}">${l}</label><input id="${k}" value="${s[k]||''}" autocomplete="off"></div>`;
 return`<div class="fg">${f('name','Full name')}${f('email','Email')}${f('addr','Address','w')}${f('city','City')}${f('pin','PIN code')}</div>
 <button class="btn" style="margin-top:20px" onclick="toPay()">Continue to payment</button>`}
function toPay(){const k=['name','email','addr','city','pin'];let ok=1;k.forEach(i=>{S.ship[i]=$('#'+i).value.trim();if(!S.ship[i]){ok=0;$('#'+i).style.borderColor='#ff4d6d'}});
 if(ok&&!/^\S+@\S+\.\S+$/.test(S.ship.email)){ok=0;toast('Enter a valid email address')}if(!ok)return toast('Fill in every field to continue');S.step=2;render()}
function payF(t){const T=[['card','Card'],['upi','UPI / QR'],['crypto','Crypto']];
 return`<div class="tabs">${T.map(([k,l])=>`<button class="${S.pay==k?'on':''}" onclick="S.pay='${k}';render(1)">${l}</button>`).join('')}</div>
 ${S.pay=='card'?`<div class="cc" id="cc"><div><div class="fc"><div class="f">NOVA·PAY</div><div class="no" id="pn">•••• •••• •••• ••••</div><div class="row" style="justify-content:space-between"><span id="pnm">YOUR NAME</span><span id="pex">MM/YY</span></div></div>
 <div class="bk"><div class="mag" style="margin-top:20px"></div><div class="cv" id="pcv">•••</div></div></div></div>
 <div class="fg"><div class="w"><label>Card number</label><input id="cn" inputmode="numeric" maxlength="19" placeholder="4242 4242 4242 4242" oninput="cardUp()"></div>
 <div class="w"><label>Name on card</label><input id="cm" oninput="cardUp()"></div><div><label>Expiry</label><input id="ce" maxlength="5" placeholder="MM/YY" oninput="cardUp()"></div>
 <div><label>CVV</label><input id="cv" maxlength="3" inputmode="numeric" onfocus="$('#cc').classList.add('fl')" onblur="$('#cc').classList.remove('fl')" oninput="cardUp()"></div></div>
 <button class="btn" style="width:100%;margin-top:18px" onclick="payCard()">Pay ${inr(t.total)}</button>`
 :S.pay=='upi'?`<div style="text-align:center"><div class="qr">${qr()}</div><p class="mut">Scan with any UPI app, or enter your UPI ID.</p>
 <input id="upi" placeholder="name@bank" style="margin-bottom:14px"><button class="btn" style="width:100%" onclick="payUPI()">Pay ${inr(t.total)}</button></div>`
 :`<p class="mut">Connect a wallet to pay ${(t.total/210000).toFixed(4)} ETH (simulated rate).</p>${S.wallet?`<div class="card" style="padding:16px;margin-bottom:14px">Connected: <b class="grad">${S.wallet}</b></div><button class="btn" style="width:100%" onclick="finish('Confirming on chain…')">Confirm ${(t.total/210000).toFixed(4)} ETH</button>`
 :['MetaMask','WalletConnect','Phantom'].map(w=>`<button class="wl" onclick="conn('${w}')"><span>${w}</span><span class="grad">Connect</span></button>`).join('')}`}`}
function cardUp(){const n=$('#cn').value.replace(/\D/g,'').slice(0,16);$('#cn').value=n.replace(/(.{4})/g,'$1 ').trim();
 let e=$('#ce').value.replace(/\D/g,'').slice(0,4);if(e.length>2)e=e.slice(0,2)+'/'+e.slice(2);$('#ce').value=e;
 $('#pn').textContent=(n.padEnd(16,'•').replace(/(.{4})/g,'$1 ').trim());$('#pnm').textContent=($('#cm').value||'YOUR NAME').toUpperCase();$('#pex').textContent=e||'MM/YY';$('#pcv').textContent=$('#cv').value||'•••'}
function payCard(){if($('#cn').value.replace(/\s/g,'').length<16||!/^\d\d\/\d\d$/.test($('#ce').value)||$('#cv').value.length<3||!$('#cm').value.trim())return toast('Check card number, name, expiry and CVV');finish('Verifying card…')}
function payUPI(){finish('Waiting for UPI confirmation…')}
function conn(w){$('#ldt').textContent='Connecting to '+w+'…';$('#ld').classList.add('on');setTimeout(()=>{$('#ld').classList.remove('on');S.wallet='0x'+[...Array(4)].map(()=>Math.random().toString(16).slice(2,6)).join('').slice(0,4)+'…'+Math.random().toString(16).slice(2,6);render(1)},1400)}
function finish(m){$('#ldt').textContent=m;$('#ld').classList.add('on');setTimeout(()=>{$('#ld').classList.remove('on');
 S.done={id:'NG-'+Date.now().toString(36).toUpperCase().slice(-6)+Math.random().toString(36).slice(2,5).toUpperCase(),t:totals().total};S.cart={};S.promo=0;S.wallet=null;sync();render()},1900)}
function done(){return`<section class="wrap ok"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48"/><path d="M38 62l16 16 30-34"/></svg><h1 style="font-size:2.4rem">Order confirmed</h1>
 <p class="mut">Thanks ${S.ship.name||''}. We sent a receipt to ${S.ship.email||'your email'}.</p><div class="oid">${S.done.id}</div><p>Paid ${inr(S.done.t)}. Estimated delivery in 3–5 days.</p>
 <a class="btn" href="#shop" onclick="S.done=null;S.step=1">Keep shopping</a></section>`}
function qr(){let s=7,r=()=>(s=s*16807%2147483647)/2147483647,N=25,c='';const fnd=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(fnd(x,y))continue;if(r()>.52)c+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="none" stroke="#0a0a0c" stroke-width="1"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
 return`<svg viewBox="-.5 -.5 26 26" fill="#0a0a0c" shape-rendering="crispEdges">${c}${f(.5,.5)}${f(N-7.5,.5)}${f(.5,N-7.5)}</svg>`}
/* ===== Router & misc ===== */
function tg(c){const i=S.cats.indexOf(c);i<0?S.cats.push(c):S.cats.splice(i,1);render(1)}
function openP(id){S.cur=get(id);S.img=0;S.qty=1;location.hash==='#product'?render():location.hash='product'}
function render(keep){const y=scrollY;const r=S.route;$('#app').innerHTML=V[r]();document.querySelectorAll('[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r==r));
 keep?scrollTo(0,y):scrollTo(0,0);if(r=='home')tick()}
function route(){let r=location.hash.slice(1);if(!V[r]||(r=='product'&&!S.cur))r=V[r]?'shop':'home';S.route=r;if(r!='checkout'&&S.done)S.done=null;render()}
function tick(){const el=$('#tm');if(!el)return;const n=new Date(),e=new Date(n);e.setHours(Math.ceil((n.getHours()+1)/8)*8,0,0,0);let d=Math.floor((e-n)/1000);
 const z=v=>String(v).padStart(2,'0');el.innerHTML=[[d/3600|0,'hrs'],[d%3600/60|0,'min'],[d%60,'sec']].map(([v,l])=>`<div><b>${z(v)}</b><small>${l}</small></div>`).join('');setTimeout(tick,1000)}
addEventListener('hashchange',route);route();drawerHTML();
</script>
</body>
</html>
